<div class="flex flex-col max-h-screen -m-6">
  <div class="flex flex-0 items-center justify-between h-16 pr-3 sm:pr-5 pl-6 sm:pl-8 bg-accent text-on-primary">
    <div class="flex items-center gap-3">
      <mat-icon class="text-current" [svgIcon]="'heroicons_outline:tag'"></mat-icon>
      <div class="text-lg font-medium">
        {{ data?.id ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}
      </div>
    </div>
    <button (click)="close()" mat-icon-button [tabIndex]="-1">
      <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
  </div>

  <form [formGroup]="form" class="flex flex-col flex-auto p-4 sm:p-6 overflow-y-auto space-y-4" (ngSubmit)="save()">

    <!-- ✅ CORRIGÉ : formControlName="nom" (était "libelle", qui ne
         correspond à aucune colonne de CategoriesEntity — le nom
         n'était donc jamais réellement enregistré). -->
    <mat-form-field class="fuse-mat w-full">
      <mat-label>Nom de la catégorie</mat-label>
      <mat-icon matPrefix class="mr-2 text-secondary" [svgIcon]="'heroicons_outline:folder'"></mat-icon>
      <input matInput type="text" placeholder="Ex : Immobilier" formControlName="nom" maxlength="100">
      <mat-hint align="end">{{ form.controls.nom.value?.length || 0 }}/100</mat-hint>
      <mat-error *ngIf="form.controls.nom.hasError('required')">
        Le nom de la catégorie est requis
      </mat-error>
      <mat-error *ngIf="form.controls.nom.hasError('minlength')">
        Le nom doit contenir au moins 2 caractères
      </mat-error>
    </mat-form-field>

    <!-- ✅ AJOUT : la description existe en base (description_cat) mais
         n'apparaissait dans aucun formulaire jusqu'ici. -->
    <mat-form-field class="fuse-mat w-full">
      <mat-label>Description</mat-label>
      <mat-icon matPrefix class="mr-2 text-secondary" [svgIcon]="'heroicons_outline:document-text'"></mat-icon>
      <textarea matInput placeholder="Description courte (optionnelle)" formControlName="description"
        maxlength="100" rows="3" cdkTextareaAutosize cdkAutosizeMinRows="2" cdkAutosizeMaxRows="4"></textarea>
      <mat-hint align="end">{{ form.controls.description.value?.length || 0 }}/100</mat-hint>
    </mat-form-field>

    <div class="flex flex-col sm:flex-row sm:items-center justify-end gap-2 pt-2">
      <!-- ✅ CORRIGÉ : [color]="'white'" n'est pas une couleur Material
           valide (seuls primary/accent/warn existent) — remplacé par un
           style neutre explicite via classes. -->
      <button (click)="close()" type="button"
        class="bg-white text-gray-700 border border-solid border-gray-300 hover:bg-gray-50"
        mat-flat-button [disabled]="inProgress">
        Annuler
      </button>
      <button type="submit" mat-flat-button [color]="'primary'" [disabled]="form.invalid || inProgress"
        class="min-w-32">
        <mat-progress-spinner *ngIf="inProgress" diameter="20" mode="indeterminate" class="mr-2 inline-block">
        </mat-progress-spinner>
        <span *ngIf="!inProgress">{{ data?.id ? 'Enregistrer' : 'Ajouter' }}</span>
        <span *ngIf="inProgress">Enregistrement...</span>
      </button>
    </div>
  </form>
</div>
