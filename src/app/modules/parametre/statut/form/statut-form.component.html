<div class="flex flex-col max-h-screen -m-6">
  <!-- Header Section -->
  <div class="flex flex-0 items-center justify-between h-16 pr-3 sm:pr-5 pl-6 sm:pl-8 bg-accent text-on-primary">
      <div class="text-lg font-medium">Formulaire de statut</div>
      <button (click)="close()" mat-icon-button [tabIndex]="-1">
          <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x'"></mat-icon>
      </button>
  </div>

  <form [formGroup]="form" class="flex flex-col flex-auto p-4 sm:p-6 overflow-y-auto space-y-4">
    <mat-form-field class="fuse-mat min-w-90">
        <mat-label>Libelle</mat-label>
        <input matInput type="text" placeholder="libelle" required formControlName="libelle" id="full-width">
        <mat-error *ngIf="form.controls.libelle.invalid">{{form.controls.libelle.errors}}</mat-error>
    </mat-form-field>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-end space-y-2 sm:space-y-0 sm:space-x-2">
          <button (click)="close()" class="my-4 border border-solid border-black-500 border-1" mat-flat-button [color]="'white'">
              Annuler
          </button>
          <button (click)="save()" class="ml-2" mat-flat-button [color]="'primary'" [disabled]="form.invalid">
              Ajouter
          </button>
      </div>
  </form>
  <!-- End Form Section -->
</div>
