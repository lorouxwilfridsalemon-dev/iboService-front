<div class="flex flex-col max-h-screen -m-6">
  <div class="flex flex-0 items-center justify-between h-16 pr-3 sm:pr-5 pl-6 sm:pl-8 bg-accent text-on-primary">
    <div class="flex items-center gap-3">
      <mat-icon class="text-current" [svgIcon]="'heroicons_outline:identification'"></mat-icon>
      <div class="text-lg font-medium">
        {{ data?.id ? 'Modifier le profil' : 'Nouveau profil' }}
      </div>
    </div>
    <button (click)="close()" mat-icon-button [tabIndex]="-1">
      <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
  </div>

  <form [formGroup]="form" class="flex flex-col flex-auto p-4 sm:p-6 overflow-y-auto space-y-4" (ngSubmit)="save()">

    <mat-form-field class="fuse-mat w-full">
      <mat-label>Libellé du profil</mat-label>
      <mat-icon matPrefix class="mr-2 text-secondary" [svgIcon]="'heroicons_outline:identification'"></mat-icon>
      <input matInput type="text" placeholder="Ex : Administrateur, Modérateur..." formControlName="libelle" maxlength="100">
      <mat-hint align="end">{{ form.controls.libelle.value?.length || 0 }}/100</mat-hint>
      <mat-error *ngIf="form.controls.libelle.hasError('required')">
        Le libellé du profil est requis
      </mat-error>
      <mat-error *ngIf="form.controls.libelle.hasError('minlength')">
        Le libellé doit contenir au moins 2 caractères
      </mat-error>
    </mat-form-field>

    <div class="flex flex-col sm:flex-row sm:items-center justify-end gap-2 pt-2">
      <button (click)="close()" type="button"
        class="bg-white text-gray-700 border border-solid border-gray-300 hover:bg-gray-50"
        mat-flat-button [disabled]="inProgress">
        Annuler
      </button>
      <button type="submit" mat-flat-button [color]="'primary'" [disabled]="form.invalid || inProgress"
        class="min-w-32">
        <mat-progress-spinner *ngIf="inProgress" diameter="20" mode="indeterminate" class="mr-2 inline-block">
        </mat-progress-spinner>
        <span *ngIf="!inProgress">{{ data?.id ? 'Enregistrer' : 'Ajouter' }}</span>
        <span *ngIf="inProgress">Enregistrement...</span>
      </button>
    </div>
  </form>
</div>
