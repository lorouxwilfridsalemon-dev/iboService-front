<div class="flex flex-col max-h-screen -m-6">
  <!-- Header Section -->
  <div class="flex flex-0 items-center justify-between h-16 pr-3 sm:pr-5 pl-6 sm:pl-8 bg-accent text-on-primary">
      <div class="text-lg font-medium">
          {{ data?.id ? 'Modifier' : 'Ajouter' }} une caractéristique
      </div>
      <button (click)="close()" mat-icon-button [tabIndex]="-1">
          <mat-icon class="text-current" [svgIcon]="'heroicons_outline:x'"></mat-icon>
      </button>
  </div>

  <form [formGroup]="form" class="flex flex-col flex-auto p-4 sm:p-6 overflow-y-auto space-y-4">
    <!-- ✅ CORRIGÉ : 'nom' au lieu de 'libelle' -->
    <mat-form-field class="fuse-mat min-w-90">
        <mat-label>Nom de la caractéristique</mat-label>
        <input matInput type="text" placeholder="Ex: Couleur, Taille, Poids" required formControlName="nom">
        <mat-error *ngIf="form.controls.nom.invalid && form.controls.nom.touched">
            <span *ngIf="form.controls.nom.errors?.required">Le nom est obligatoire</span>
            <span *ngIf="form.controls.nom.errors?.minlength">Minimum 2 caractères</span>
            <span *ngIf="form.controls.nom.errors?.maxlength">Maximum 100 caractères</span>
        </mat-error>
    </mat-form-field>

    <!-- ✅ AJOUT : champ description (existe dans l'entité) -->
    <mat-form-field class="fuse-mat min-w-90">
        <mat-label>Description (optionnelle)</mat-label>
        <input matInput type="text" placeholder="Description de la caractéristique" formControlName="description">
    </mat-form-field>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-end space-y-2 sm:space-y-0 sm:space-x-2 mt-4">
        <button (click)="close()" class="border border-solid border-gray-300" mat-stroked-button [color]="'warn'">
            Annuler
        </button>
        <button (click)="save()" mat-flat-button [color]="'primary'" [disabled]="form.invalid || inProgress">
            <mat-icon *ngIf="inProgress" class="mr-2 spin" [svgIcon]="'heroicons_outline:refresh'"></mat-icon>
            {{ data?.id ? 'Modifier' : 'Ajouter' }}
        </button>
    </div>
  </form>
</div>
