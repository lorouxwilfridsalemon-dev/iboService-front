      <mat-form-field class="fuse-mat min-w-full">
        <mat-label>Description</mat-label>
        <textarea matInput placeholder="Ex...." formControlName="description"></textarea>
        <mat-error *ngIf="form.controls.description.invalid && (form.controls.description.dirty || form.controls.description.touched)">
          <span *ngIf="form.controls.description.hasError('required')">La description est requise.</span>
          <span *ngIf="form.controls.description.hasError('minlength')">La description doit comporter au moins 3 caractères.</span>
        </mat-error>
      </mat-form-field>


<div class="flex flex-col sm:flex-row sm:items-center justify-end">

       <button
